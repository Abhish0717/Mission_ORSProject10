<div class="Attendance-page">

    <div class="container py-4">

        <div class="Attendance-card">

            <!-- Header -->
            <div class="Attendance-header">

                <div>
                    <h1 *ngIf="!form.data.id">
                        <i class="bi bi-calendar-check-fill me-2"></i>
                        Add Attendance
                    </h1>

                    <h1 *ngIf="form.data.id > 0">
                        <i class="bi bi-calendar-check me-2"></i>
                        Update Attendance
                    </h1>

                    <p>
                        Manage Attendance information
                    </p>
                </div>

                <div class="Attendance-icon">
                    <i class="bi bi-calendar-check-fill"></i>
                </div>

            </div>


            <!-- Success Message -->
            <div class="alert alert-success alert-dismissible fade show" *ngIf="!form.error && form.message"
                Attendance="alert">

                <i class="bi bi-check-circle-fill me-2"></i>

                {{form.message}}

                <button type="button" class="btn-close" aria-label="Close" (click)="form.message = ''">
                </button>

            </div>


            <!-- Error Message -->
            <div class="alert alert-danger alert-dismissible fade show" *ngIf="form.error && form.message"
                Attendance="alert">

                <i class="bi bi-exclamation-triangle-fill me-2"></i>

                {{form.message}}

                <button type="button" class="btn-close" aria-label="Close" (click)="form.message = ''">
                </button>

            </div>


            <!-- Form -->
            <form (submit)="submit()">

                <div class="Attendance-body">

                    <div class="row g-4">


                        <!-- Student Id -->
                        <div class="col-12">

                            <label class="form-label">
                                Student Id <span class="required">*</span>
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-person me-1"></i>
                                </span>

                                <input type="text" name="studentId" class="form-control"
                                    [(ngModel)]="form.data.studentId" placeholder="Enter Student Id">

                            </div>

                            <div class="validation-error">
                                {{form.inputerror.studentId}}
                            </div>

                        </div>


                        <!-- Attendance Date -->
                        <div class="col-12">

                            <label class="form-label">
                                Attendance Date <span class="required">*</span>
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-calendar-date me-1"></i>
                                </span>

                                <input type="date" name="aDate" class="form-control" [(ngModel)]="form.data.aDate"
                                    placeholder="Enter Attendance Date">

                            </div>

                            <div class="validation-error">
                                {{form.inputerror.aDate}}
                            </div>

                        </div>


                        <!-- Status -->
                        <div class="col-12">

                            <label class="form-label">
                                Status <span class="required">*</span>
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-check2-circle me-1"></i>
                                </span>

                                <input type="text" name="status" class="form-control" [(ngModel)]="form.data.status"
                                    placeholder="Enter Attendance Status">

                            </div>

                            <div class="validation-error">
                                {{form.inputerror.status}}
                            </div>

                        </div>


                        <!-- Remarks -->
                        <div class="col-12">

                            <label class="form-label">
                                Remarks <span class="required">*</span>
                            </label>

                            <div class="input-group">

                                <span class="input-group-text textarea-icon">
                                    <i class="bi bi-chat-left-text me-1"></i>
                                </span>

                                <textarea name="remarks" class="form-control" rows="4" [(ngModel)]="form.data.remarks"
                                    placeholder="Enter Remarks"></textarea>

                            </div>

                            <div class="validation-error">
                                {{form.inputerror.remarks}}
                            </div>

                        </div>

                    </div>


                    <!-- Buttons -->
                    <div class="Attendance-actions">

                        <button type="submit" class="btn btn-primary Attendance-btn">

                            <i class="bi" [ngClass]="form.data.id ? 'bi-check-circle-fill' : 'bi-plus-circle-fill'">
                            </i>

                            {{form.data.id ? 'Update' : 'Save'}}

                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>

</div>
