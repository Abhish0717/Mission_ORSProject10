<div class="registration-page">

    <div class="container py-4">

        <div class="registration-card">

            <!-- Header -->
            <div class="registration-header">
                <div>
                    <h1>
                        <i class="bi bi-person-plus-fill me-2"></i>
                        User Registration
                    </h1>

                    <p>Create a new user account</p>
                </div>

                <div class="registration-icon">
                    <i class="bi bi-person-vcard-fill"></i>
                </div>
            </div>


            <!-- Messages -->

            <div class="alert alert-success alert-dismissible fade show" *ngIf="!form.error && form.message"
                role="alert">

                <i class="bi bi-check-circle-fill me-2"></i>
                {{ form.message }}

                <button type="button" class="btn-close" aria-label="Close" (click)="form.message = ''">
                </button>

            </div>


            <div class="alert alert-danger alert-dismissible fade show" *ngIf="form.error && form.message" role="alert">

                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                {{ form.message }}

                <button type="button" class="btn-close" aria-label="Close" (click)="form.message = ''">
                </button>

            </div>


            <!-- Form -->

            <div class="registration-body">

                <div class="row g-4">


                    <!-- First Name -->

                    <div class="col-md-6">

                        <label class="form-label">
                            First Name <span class="required">*</span>
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-person"></i>
                            </span>

                            <input type="text" name="firstName" class="form-control" [(ngModel)]="form.data.firstName"
                                placeholder="Enter First Name">

                        </div>

                        <div class="validation-error">
                            {{form.inputerror.firstName}}
                        </div>

                    </div>


                    <!-- Last Name -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Last Name <span class="required">*</span>
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-person"></i>
                            </span>

                            <input type="text" name="lastName" class="form-control" [(ngModel)]="form.data.lastName"
                                placeholder="Enter Last Name">

                        </div>

                        <div class="validation-error">
                            {{form.inputerror.lastName}}
                        </div>

                    </div>


                    <!-- Login ID -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Login ID <span class="required">*</span>
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-person-badge"></i>
                            </span>

                            <input type="text" name="loginId" class="form-control" [(ngModel)]="form.data.login"
                                placeholder="Enter Login ID">

                        </div>

                        <div class="validation-error">
                            {{form.inputerror.login}}
                        </div>

                    </div>


                    <!-- Password -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Password <span class="required">*</span>
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-lock-fill"></i>
                            </span>

                            <input type="password" name="password" class="form-control" [(ngModel)]="form.data.password"
                                placeholder="Enter Password">

                        </div>

                        <div class="validation-error">
                            {{form.inputerror.password}}
                        </div>

                    </div>


                    <!-- Date of Birth -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Date of Birth <span class="required">*</span>
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-calendar-event"></i>
                            </span>

                            <input type="date" name="dob" class="form-control" [(ngModel)]="form.data.dob">

                        </div>

                        <div class="validation-error">
                            {{form.inputerror.dob}}
                        </div>

                    </div>


                    <!-- Gender -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Gender <span class="required">*</span>
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-gender-ambiguous"></i>
                            </span>

                            <select name="gender" class="form-select" [(ngModel)]="form.data.gender">

                                <option value="undefined">
                                    Select Gender
                                </option>

                                <option value="Male">
                                    Male
                                </option>

                                <option value="Female">
                                    Female
                                </option>

                            </select>

                        </div>

                        <div class="validation-error">
                            {{form.inputerror.gender}}
                        </div>

                    </div>


                    <!-- Mobile -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Mobile <span class="required">*</span>
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-phone-fill"></i>
                            </span>

                            <input type="text" name="phone" class="form-control" [(ngModel)]="form.data.phone"
                                maxlength="10" placeholder="Enter Mobile No.">

                        </div>

                        <div class="validation-error">
                            {{form.inputerror.phone}}
                        </div>

                    </div>

                </div>


                <!-- Buttons -->

                <div class="registration-actions">

                    <button type="button" class="btn btn-primary registration-btn" (click)="signUp()">

                        <i class="bi bi-person-plus-fill me-2"></i>
                        Sign Up

                    </button>


                    <button type="button" class="btn btn-outline-secondary registration-btn" (click)="reset()">

                        <i class="bi bi-arrow-counterclockwise me-2"></i>
                        Reset

                    </button>

                </div>

            </div>

        </div>

    </div>

</div>
