<div class="forgot-password-wrapper">
    <div class="card shadow-lg border-0 w-100 forgot-password-card" style="max-width:550px; border-radius:15px;">

        <!-- Header -->
        <div class="card-header text-center text-white py-3"
            style="background:linear-gradient(135deg,#0d6efd,#0a58ca);">

            <h3 class="fw-bold mb-0">
                <i class="bi bi-question-circle-fill me-2"></i>
                Forgot Password
            </h3>

        </div>

        <!-- Body -->
        <div class="card-body p-4">

            <!-- Success Message -->
            <div *ngIf="!form.error && form.message"
                 class="alert alert-success alert-dismissible fade show mb-3" role="alert">

                <i class="bi bi-check-circle-fill me-2"></i>
                {{ form.message }}

                <button type="button"
                        class="btn-close"
                        aria-label="Close"
                        (click)="closeMessage()"></button>

            </div>

            <!-- Error Message -->
            <div *ngIf="form.error && form.message"
                 class="alert alert-danger alert-dismissible fade show mb-3" role="alert">

                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                {{ form.message }}

                <button type="button"
                        class="btn-close"
                        aria-label="Close"
                        (click)="closeMessage()"></button>

            </div>

            <!-- Info Text -->
            <p class="text-muted mb-4">
                <i class="bi bi-info-circle me-2"></i>
                Enter your login ID to reset your password
            </p>

            <!-- Form -->
            <form (submit)="submit()">

                <!-- Login ID -->
                <div class="mb-4">

                    <label class="form-label fw-semibold">
                        <i class="bi bi-person-fill me-1"></i>
                        Login ID <span class="text-danger">*</span>
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="login"
                        [(ngModel)]="form.data.login"
                        placeholder="Enter your login ID">

                    <small class="text-danger" *ngIf="form.inputerror.login">
                        {{form.inputerror.login}}
                    </small>

                </div>

                <!-- Buttons -->
                <div class="d-grid gap-2">

                    <button
                        type="submit"
                        class="btn btn-primary btn-lg rounded-pill fw-semibold"
                        style="padding:10px 20px;">

                        <i class="bi bi-envelope-check-fill me-2"></i>
                        Send Reset Link

                    </button>

                    <button
                        type="button"
                        class="btn btn-outline-secondary btn-lg rounded-pill fw-semibold"
                        (click)="goBack()"
                        style="padding:10px 20px;">

                        <i class="bi bi-arrow-left me-2"></i>
                        Back to Login

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>
