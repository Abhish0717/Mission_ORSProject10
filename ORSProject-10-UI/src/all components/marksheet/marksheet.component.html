<div class="role-page">

    <div class="container py-4">

        <div class="role-card">

            <!-- Header -->
            <div class="role-header">
                <div>
                    <h1 *ngIf="!form.data.id">
                        <i class="bi bi-file-earmark-bar-graph-fill me-2"></i>
                        Add Marksheet
                    </h1>
                    <h1 *ngIf="form.data.id > 0">
                        <i class="bi bi-pencil-square me-2"></i>
                        Update Marksheet
                    </h1>
                    <p>Manage student marksheet information</p>
                </div>
                <div class="role-icon">
                    <i class="bi bi-shield-check"></i>
                </div>
            </div>

            <div class="alert alert-success alert-dismissible fade show" *ngIf="!form.error && form.message"
                role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                {{form.message}}
                <button type="button" class="btn-close" aria-label="Close" (click)="form.message = ''"></button>
            </div>

            <div class="alert alert-danger alert-dismissible fade show" *ngIf="form.error && form.message" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                {{form.message}}
                <button type="button" class="btn-close" aria-label="Close" (click)="form.message = ''"></button>
            </div>

            <form (submit)="submit()">
                <div class="role-body">
                    <div class="row g-4">
                        <div class="col-12">
                            <label class="form-label">Roll No <span class="required">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-hash"></i></span>
                                <input type="text" name="rollNo" class="form-control" [(ngModel)]="form.data.rollNo"
                                    placeholder="Enter Roll No">
                            </div>
                            <div class="validation-error">{{form.inputerror.rollNo}}</div>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Student <span class="required">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                                <select name="studentId" class="form-select" [(ngModel)]="form.data.studentId">
                                    <option value="undefined">Select Student</option>
                                    <option *ngFor="let obj of form.preload.studentList" [value]="obj.key">{{obj.value}}
                                    </option>
                                </select>
                            </div>
                            <div class="validation-error">{{form.inputerror.studentId}}</div>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Physics <span class="required">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-journal-text"></i></span>
                                <input type="text" name="physics" class="form-control" [(ngModel)]="form.data.physics"
                                    placeholder="Enter Physics Marks">
                            </div>
                            <div class="validation-error">{{form.inputerror.physics}}</div>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Chemistry <span class="required">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-journal-text"></i></span>
                                <input type="text" name="chemistry" class="form-control"
                                    [(ngModel)]="form.data.chemistry" placeholder="Enter Chemistry Marks">
                            </div>
                            <div class="validation-error">{{form.inputerror.chemistry}}</div>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Maths <span class="required">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-calculator"></i></span>
                                <input type="text" name="maths" class="form-control" [(ngModel)]="form.data.maths"
                                    placeholder="Enter Maths Marks">
                            </div>
                            <div class="validation-error">{{form.inputerror.maths}}</div>
                        </div>

                    </div>
                    <div class="role-actions">
                        <button type="submit" class="btn btn-primary role-btn">
                            <i class="bi" [ngClass]="form.data.id ? 'bi-check-circle-fill' : 'bi-plus-circle-fill'"></i>
                            {{form.data.id ? 'Update' : 'Save'}}
                        </button>
                    </div>
                </div>
            </form>

        </div>
    </div>
</div>
