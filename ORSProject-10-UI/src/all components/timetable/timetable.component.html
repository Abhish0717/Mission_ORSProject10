<div class="role-page">

    <div class="container py-4">

        <div class="role-card">

            <!-- Header -->
            <div class="role-header">
                <div>
                    <h1 *ngIf="!form.data.id">
                        <i class="bi bi-calendar3 me-2"></i>
                        Add Timetable
                    </h1>
                    <h1 *ngIf="form.data.id > 0">
                        <i class="bi bi-pencil-square me-2"></i>
                        Update Timetable
                    </h1>
                    <p>Manage examination schedule information</p>
                </div>
                <div class="role-icon">
                    <i class="bi bi-shield-check"></i>
                </div>
            </div>

            <div class="alert alert-success alert-dismissible fade show" *ngIf="!form.error && form.message"
                role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                {{form.message}}
                <button type="button" class="btn-close" aria-label="Close" (click)="form.message = ''"></button>
            </div>

            <div class="alert alert-danger alert-dismissible fade show" *ngIf="form.error && form.message" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                {{form.message}}
                <button type="button" class="btn-close" aria-label="Close" (click)="form.message = ''"></button>
            </div>

            <form (submit)="submit()">
                <div class="role-body">
                    <div class="row g-4">
                        <div class="col-12">
                            <label class="form-label">Course <span class="required">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-book"></i></span>
                                <select name="courseId" class="form-select" [(ngModel)]="form.data.courseId">
                                    <option value="undefined">Select Course</option>
                                    <option *ngFor="let obj of form.preload.courseList" [value]="obj.key">{{obj.value}}
                                    </option>
                                </select>
                            </div>
                            <div class="validation-error">{{form.inputerror.courseId}}</div>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Subject <span class="required">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-journal-bookmark"></i></span>
                                <select name="subjectId" class="form-select" [(ngModel)]="form.data.subjectId">
                                    <option value="undefined">Select Subject</option>
                                    <option *ngFor="let obj of form.preload.subjectList" [value]="obj.key">{{obj.value}}
                                    </option>
                                </select>
                            </div>
                            <div class="validation-error">{{form.inputerror.subjectId}}</div>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Semester <span class="required">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-layers"></i></span>
                                <select name="semester" class="form-select" [(ngModel)]="form.data.semester">
                                    <option value="undefined">Select Semester</option>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                    <option value="6">6</option>
                                    <option value="7">7</option>
                                    <option value="8">8</option>
                                </select>
                            </div>
                            <div class="validation-error">{{form.inputerror.semester}}</div>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Exam Date <span class="required">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-calendar-event"></i></span>
                                <input type="date" name="examDate" class="form-control" [(ngModel)]="form.data.examDate"
                                    placeholder="Select Exam Date">
                            </div>
                            <div class="validation-error">{{form.inputerror.examDate}}</div>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Exam Time <span class="required">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-clock"></i></span>
                                <select name="examTime" class="form-select" [(ngModel)]="form.data.examTime">
                                    <option value="undefined">Select Exam Time</option>
                                    <option value="08:00 AM to 11:00 AM">08:00 AM to 11:00 AM</option>
                                    <option value="12:00 PM to 03:00 PM">12:00 PM to 03:00 PM</option>
                                    <option value="04:00 PM to 07:00 PM">04:00 PM to 07:00 PM</option>
                                </select>
                            </div>
                            <div class="validation-error">{{form.inputerror.examTime}}</div>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Description <span class="required">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text textarea-icon"><i class="bi bi-card-text"></i></span>
                                <textarea name="description" class="form-control" rows="4"
                                    [(ngModel)]="form.data.description"
                                    placeholder="Enter Short Description"></textarea>
                            </div>
                            <div class="validation-error">{{form.inputerror.description}}</div>
                        </div>

                    </div>
                    <div class="role-actions">
                        <button type="submit" class="btn btn-primary role-btn">
                            <i class="bi" [ngClass]="form.data.id ? 'bi-check-circle-fill' : 'bi-plus-circle-fill'"></i>
                            {{form.data.id ? 'Update' : 'Save'}}
                        </button>
                    </div>
                </div>
            </form>

        </div>
    </div>
</div>
