<div class="container-fluid d-flex justify-content-center align-items-center" style="background-image: url('assets/ors-welcome.webp');
     background-size: cover;
     background-attachment: fixed; min-height: calc(100vh - 125px); padding: 25px 15px;">

    <div class="card shadow-lg border-0 w-100" style="max-width: 630px; border-radius: 15px; overflow: hidden;">

        <!-- Header -->
        <div class="card-header text-center text-white py-3"
            style="background: linear-gradient(135deg, #0d6efd, #0a58ca);">

            <h3 class="fw-bold mb-0">
                <i class="bi bi-person-circle me-2"></i>
                {{ 'Links.MyProfile' | translate }}
            </h3>

        </div>


        <!-- Body -->
        <div class="card-body p-4">

            <!-- Success Message -->
            <div *ngIf="!form.error && form.message" class="alert alert-success mb-3" role="alert">

                <i class="bi bi-check-circle-fill me-2"></i>
                {{ form.message }}

            </div>


            <!-- Error Message -->
            <div *ngIf="form.error && form.message" class="alert alert-danger mb-3" role="alert">

                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                {{ form.message }}

            </div>


            <!-- First Name + Last Name -->
            <div class="row g-3">

                <!-- First Name -->
                <div class="col-md-6">

                    <label class="form-label fw-semibold">
                        <i class="bi bi-person-fill me-1"></i>
                        {{ 'UserForm.FirstName' | translate }}
                        <span class="text-danger">*</span>
                    </label>

                    <input type="text" class="form-control" [ngClass]="{'is-invalid': form.inputerror.firstName}"
                        [(ngModel)]="form.data.firstName" name="firstName"
                        placeholder="{{ 'UserForm.Placeholders.FirstName' | translate }}">

                    <small class="text-danger" *ngIf="form.inputerror.firstName">
                        {{ form.inputerror.firstName }}
                    </small>

                </div>


                <!-- Last Name -->
                <div class="col-md-6">

                    <label class="form-label fw-semibold">
                        <i class="bi bi-person-fill me-1"></i>
                        {{ 'UserForm.LastName' | translate }}
                        <span class="text-danger">*</span>
                    </label>

                    <input type="text" class="form-control" [ngClass]="{'is-invalid': form.inputerror.lastName}"
                        [(ngModel)]="form.data.lastName" name="lastName"
                        placeholder="{{ 'UserForm.Placeholders.LastName' | translate }}">

                    <small class="text-danger" *ngIf="form.inputerror.lastName">
                        {{ form.inputerror.lastName }}
                    </small>

                </div>

            </div>


            <!-- Login ID -->
            <div class="mt-3">

                <label class="form-label fw-semibold">
                    <i class="bi bi-envelope-fill me-1"></i>
                    {{ 'UserForm.Login' | translate }}
                    <span class="text-danger">*</span>
                </label>

                <input type="text" class="form-control bg-light" [(ngModel)]="form.data.login"
                    placeholder="{{ 'UserForm.Placeholders.login' | translate }}" name="login" readonly>

                <small class="text-muted">
                    {{ 'Messages.LoginIdCannotChange' | translate }}
                </small>

            </div>


            <!-- Date of Birth -->
            <div class="mt-3">

                <label class="form-label fw-semibold">
                    <i class="bi bi-calendar-event-fill me-1"></i>
                    {{ 'UserForm.DateOfBirth' | translate }}
                    <span class="text-danger">*</span>
                </label>

                <input type="date" class="form-control" [ngClass]="{'is-invalid': form.inputerror.dob}"
                    [(ngModel)]="form.data.dob" name="dob">

                <small class="text-danger" *ngIf="form.inputerror.dob">
                    {{ form.inputerror.dob }}
                </small>

            </div>


            <!-- Gender + Mobile -->
            <div class="row g-3 mt-0">

                <!-- Gender -->
                <div class="col-md-6">

                    <label class="form-label fw-semibold">
                        <i class="bi bi-gender-ambiguous me-1"></i>
                        {{ 'UserForm.Gender' | translate }}
                        <span class="text-danger">*</span>
                    </label>

                    <select class="form-select" [ngClass]="{'is-invalid': form.inputerror.gender}"
                        [(ngModel)]="form.data.gender" name="gender">

                        <option value="">
                            {{ 'GenderOptions.Select' | translate }}
                        </option>

                        <option value="Male">
                            {{ 'GenderOptions.Male' | translate }}
                        </option>

                        <option value="Female">
                            {{ 'GenderOptions.Female' | translate }}
                        </option>

                    </select>

                    <small class="text-danger" *ngIf="form.inputerror.gender">
                        {{ form.inputerror.gender }}
                    </small>

                </div>


                <!-- Mobile -->
                <div class="col-md-6">

                    <label class="form-label fw-semibold">
                        <i class="bi bi-phone-fill me-1"></i>
                        {{ 'UserForm.Mobile' | translate }}
                        <span class="text-danger">*</span>
                    </label>

                    <input type="text" class="form-control" maxlength="10"
                        [ngClass]="{'is-invalid': form.inputerror.phone}" [(ngModel)]="form.data.phone" name="phone"
                        placeholder="{{ 'UserForm.Placeholders.Mobile' | translate }}">

                    <small class="text-danger" *ngIf="form.inputerror.phone">
                        {{ form.inputerror.phone }}
                    </small>

                </div>

            </div>

            <!-- Buttons -->
            <div class="row g-2 mt-3">

                <!-- Save -->
                <div class="col-md-6">

                    <button type="button" class="btn btn-primary btn-lg rounded-pill w-100" (click)="myProfile()">

                        <i class="bi bi-check-circle-fill me-2"></i>
                        {{ 'UserForm.Buttons.Save' | translate }}

                    </button>

                </div>


                <!-- Back -->
                <div class="col-md-6">

                    <button type="button" class="btn btn-outline-secondary btn-lg rounded-pill w-100"
                        (click)="forward('/userlist')">

                        <i class="bi bi-arrow-left me-2"></i>
                        {{ 'Buttons.Back' | translate }}

                    </button>

                </div>

            </div>

        </div>

    </div>

</div>
