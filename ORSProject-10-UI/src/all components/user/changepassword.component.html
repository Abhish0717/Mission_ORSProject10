<div class="container d-flex justify-content-center py-5" style="margin-top:80px;">

    <div class="card shadow-lg border-0 w-100" style="max-width:550px; border-radius:15px;">

        <!-- Header -->
        <div class="card-header text-center text-white py-3"
            style="background:linear-gradient(135deg,#0d6efd,#0a58ca);">

            <h3 class="fw-bold mb-0">
                <i class="bi bi-key-fill me-2"></i>
                Change Password
            </h3>

        </div>

        <!-- Body -->
        <div class="card-body p-4">

            <!-- Success Message -->
            <div *ngIf="!form.error && form.message"
                 class="alert alert-success alert-dismissible fade show mb-3" role="alert">

                <i class="bi bi-check-circle-fill me-2"></i>
                {{ form.message }}

                <button type="button"
                        class="btn-close"
                        aria-label="Close"
                        (click)="closeMessage()"></button>

            </div>

            <!-- Error Message -->
            <div *ngIf="form.error && form.message"
                 class="alert alert-danger alert-dismissible fade show mb-3" role="alert">

                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                {{ form.message }}

                <button type="button"
                        class="btn-close"
                        aria-label="Close"
                        (click)="closeMessage()"></button>

            </div>

            <!-- Form -->
            <form (submit)="changePassword()">

                <!-- Old Password -->
                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        <i class="bi bi-key-fill me-1"></i>
                        Old Password <span class="text-danger">*</span>
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        name="oldPassword"
                        [(ngModel)]="form.data.oldPassword"
                        placeholder="Enter Old Password">

                    <small class="text-danger" *ngIf="form.inputerror.oldPassword">
                        {{form.inputerror.oldPassword}}
                    </small>

                </div>

                <!-- New Password -->
                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        <i class="bi bi-lock-fill me-1"></i>
                        New Password <span class="text-danger">*</span>
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        name="newPassword"
                        [(ngModel)]="form.data.newPassword"
                        placeholder="Enter New Password">

                    <small class="text-danger" *ngIf="form.inputerror.newPassword">
                        {{form.inputerror.newPassword}}
                    </small>

                </div>

                <!-- Confirm Password -->
                <div class="mb-4">

                    <label class="form-label fw-semibold">
                        <i class="bi bi-lock-check me-1"></i>
                        Confirm Password <span class="text-danger">*</span>
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        name="confirmPassword"
                        [(ngModel)]="form.data.confirmPassword"
                        placeholder="Confirm New Password">

                    <small class="text-danger" *ngIf="form.inputerror.confirmPassword">
                        {{form.inputerror.confirmPassword}}
                    </small>

                </div>

                <!-- Buttons -->
                <div class="d-grid gap-2">

                    <button
                        type="submit"
                        class="btn btn-primary btn-lg rounded-pill">

                        <i class="bi bi-shield-lock-fill me-2"></i>
                        Change Password

                    </button>

                    <button
                        type="button"
                        class="btn btn-outline-secondary btn-lg rounded-pill"
                        (click)="forward('/dashboard')">

                        <i class="bi bi-arrow-left me-2"></i>
                        Cancel

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>
