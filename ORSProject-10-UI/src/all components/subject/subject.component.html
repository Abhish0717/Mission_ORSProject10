<div class="role-page">

    <div class="container py-4">

        <div class="role-card">

            <!-- Header -->
            <div class="role-header">
                <div>
                    <h1 *ngIf="!form.data.id">
                        <i class="bi bi-journal-bookmark-fill me-2"></i>
                        Add Subject
                    </h1>
                    <h1 *ngIf="form.data.id > 0">
                        <i class="bi bi-pencil-square me-2"></i>
                        Update Subject
                    </h1>
                    <p>Manage subject information</p>
                </div>
                <div class="role-icon">
                    <i class="bi bi-shield-check"></i>
                </div>
            </div>

            <div class="alert alert-success alert-dismissible fade show" *ngIf="!form.error && form.message"
                role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                {{form.message}}
                <button type="button" class="btn-close" aria-label="Close" (click)="form.message = ''"></button>
            </div>

            <div class="alert alert-danger alert-dismissible fade show" *ngIf="form.error && form.message" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                {{form.message}}
                <button type="button" class="btn-close" aria-label="Close" (click)="form.message = ''"></button>
            </div>

            <form (submit)="submit()">
                <div class="role-body">
                    <div class="row g-4">
                        <div class="col-12">
                            <label class="form-label">Course <span class="required">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-book"></i></span>
                                <select name="courseId" class="form-select" [(ngModel)]="form.data.courseId">
                                    <option value="undefined">Select Course</option>
                                    <option *ngFor="let obj of form.preload.courseList" [value]="obj.key">{{obj.value}}
                                    </option>
                                </select>
                            </div>
                            <div class="validation-error">{{form.inputerror.courseId}}</div>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Subject Name <span class="required">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-journal-bookmark"></i></span>
                                <input type="text" name="name" class="form-control" [(ngModel)]="form.data.name"
                                    placeholder="Enter Subject Name">
                            </div>
                            <div class="validation-error">{{form.inputerror.name}}</div>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Description <span class="required">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text textarea-icon"><i class="bi bi-card-text"></i></span>
                                <textarea name="description" class="form-control" rows="4"
                                    [(ngModel)]="form.data.description"
                                    placeholder="Enter Short Description"></textarea>
                            </div>
                            <div class="validation-error">{{form.inputerror.description}}</div>
                        </div>

                    </div>
                    <div class="role-actions">
                        <button type="submit" class="btn btn-primary role-btn">
                            <i class="bi" [ngClass]="form.data.id ? 'bi-check-circle-fill' : 'bi-plus-circle-fill'"></i>
                            {{form.data.id ? 'Update' : 'Save'}}
                        </button>
                    </div>
                </div>
            </form>

        </div>
    </div>
</div>
