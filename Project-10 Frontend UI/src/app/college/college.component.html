<div class="role-page">

    <div class="container py-4">

        <div class="role-card">

            <!-- Header -->
            <div class="role-header">
                <div>
                    <h1 *ngIf="!form.data.id">
                        <i class="bi bi-building me-2"></i>
                        Add College
                    </h1>
                    <h1 *ngIf="form.data.id > 0">
                        <i class="bi bi-pencil-square me-2"></i>
                        Update College
                    </h1>
                    <p>Manage college information</p>
                </div>
                <div class="role-icon">
                    <i class="bi bi-shield-check"></i>
                </div>
            </div>

            <div class="alert alert-success alert-dismissible fade show" *ngIf="!form.error && form.message"
                role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                {{form.message}}
                <button type="button" class="btn-close" aria-label="Close" (click)="form.message = ''"></button>
            </div>

            <div class="alert alert-danger alert-dismissible fade show" *ngIf="form.error && form.message" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                {{form.message}}
                <button type="button" class="btn-close" aria-label="Close" (click)="form.message = ''"></button>
            </div>

            <form (submit)="submit()">
                <div class="role-body">
                    <div class="row g-4">
                        <div class="col-12">
                            <label class="form-label">College Name <span class="required">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-building"></i></span>
                                <input type="text" name="name" class="form-control" [(ngModel)]="form.data.name"
                                    placeholder="Enter College Name">
                            </div>
                            <div class="validation-error">{{form.inputerror.name}}</div>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Address <span class="required">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
                                <input type="text" name="address" class="form-control" [(ngModel)]="form.data.address"
                                    placeholder="Enter Address">
                            </div>
                            <div class="validation-error">{{form.inputerror.address}}</div>
                        </div>

                        <div class="col-12">
                            <label class="form-label">State <span class="required">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-map"></i></span>
                                <input type="text" name="state" class="form-control" [(ngModel)]="form.data.state"
                                    placeholder="Enter State">
                            </div>
                            <div class="validation-error">{{form.inputerror.state}}</div>
                        </div>

                        <div class="col-12">
                            <label class="form-label">City <span class="required">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-buildings"></i></span>
                                <input type="text" name="city" class="form-control" [(ngModel)]="form.data.city"
                                    placeholder="Enter City">
                            </div>
                            <div class="validation-error">{{form.inputerror.city}}</div>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Phone No <span class="required">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                                <input type="text" name="phoneNo" class="form-control" [(ngModel)]="form.data.phoneNo"
                                    placeholder="Enter Phone No.">
                            </div>
                            <div class="validation-error">{{form.inputerror.phoneNo}}</div>
                        </div>

                    </div>
                    <div class="role-actions">
                        <button type="submit" class="btn btn-primary role-btn">
                            <i class="bi" [ngClass]="form.data.id ? 'bi-check-circle-fill' : 'bi-plus-circle-fill'"></i>
                            {{form.data.id ? 'Update' : 'Save'}}
                        </button>
                    </div>
                </div>

            </form>
        </div>
    </div>
